# ============================================================================
# Minimal example: single-skill repo
# ============================================================================
#
# This is the simplest possible manifest: one repo that has a SKILL.md at
# its root. skill-sync installs it as a single skill.
#
# To use this file:
#   cp examples/minimal.skills.toml .skills.toml
#   skill-sync
#
# ============================================================================

[skills]
repos = [
    "anthropics/skills/skills/skill-creator",
]
